# Felix's own test suite, run on Felix's own pull requests.
#
# The repo shipped with no CI at all, which meant the "174 tests pass" claim in the README
# was a statement about one laptop. A tool whose entire product is "don't trust the diff,
# run the code" cannot ask that of others and skip it itself.
#
# No secrets are used or needed: the suite touches process.env zero times, injects its own
# fetch and sleep, and makes no network calls. That is deliberate — it means this workflow
# runs identically on pull requests from forks, where secrets are not available, so an
# outside contributor gets the same signal a maintainer does.
name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the previous run irrelevant; don't queue behind it.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current LTS. The floor is what the docs implicitly promise;
        # testing only the newest hides a syntax or API assumption until someone else finds it.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install
        run: npm ci

      - name: test
        run: npm test

  # The unit suite builds the docker command string and asserts its shape; it cannot tell you
  # whether that string actually runs, because the dev box this was written on has no docker.
  # The bug this guards — a read-only HOME making `npm ci` impossible inside the jail — lived
  # undetected precisely in that gap. So one job runs a real install inside a real container.
  #
  # It is differential: it also runs the pre-fix command shape as a control and requires that one
  # to FAIL. If the control passes, the probe exits non-zero and says the diagnosis was wrong.
  # A green run is only worth something if the control could have gone red.
  docker-jail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        run: npm ci
      - name: probe the docker jail with a real install
        run: node scripts/probe-docker-jail.js

  # Same shape, different claim. The unit suite can only prove that buildCleanEnv() is CALLED.
  # Whether a real `git worktree add` runs a real post-checkout hook, and whether that hook
  # really inherits the parent's environment, is a claim about git — so it gets checked against
  # git, with a control that must fail before the fix. See scripts/probe-hook-env-leak.js.
  hook-env-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci`: the probe imports only util/exec and util/env, both dependency-free. Keeps
      # the job honest about what it is exercising, and fast.
      #
      # GITHUB_TOKEN is exported ON PURPOSE. A runner does not put it in the process environment
      # by default, so without this the probe's "no secret-shaped name reached the hook" check
      # runs against ONE name — the fake one it planted itself — and proves almost nothing. With
      # it, the allowlist is checked against a real credential of the exact kind Felix carries.
      # The probe prints names, never values, and only names that SURVIVED (none, when the fix
      # holds).
      - name: probe — post-checkout hook environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/probe-hook-env-leak.js
